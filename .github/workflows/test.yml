name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    uses: slaclab/swapps-ci-helpers/.github/workflows/js-test.yml@afaac9fd67e0b31c887a48c19d9a6b219ea72a8f
    with:
      node-version: "23.11.0"
      test-command: "pnpm --filter @slaclab/canopy-screen-ir run spec:check && pnpm test"
