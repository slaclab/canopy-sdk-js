name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    uses: slaclab/swapps-ci-helpers/.github/workflows/js-test.yml@ab0c25cb9b7ee308b967e43bcd885ed15b179b1f
    with:
      node-version: "23.11.0"
      test-command: "pnpm --filter @slaclab/canopy-screen-ir run spec:check && pnpm test"
