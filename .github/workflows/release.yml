name: Release

# Publishes every workspace package to npmjs.com when a version tag is pushed.
# Flow: bump versions (lockstep) on main → tag v<version> → push tag.
# Auth is npm trusted publishing (OIDC) — no secrets to manage. Each package
# must name this repo and this workflow as its trusted publisher on npmjs.com.
# That needs the package to exist, so a NEW package's first version is published
# by hand with `pnpm publish --access public` before the tag is pushed. Use pnpm,
# not npm (see scripts/check-package-tarballs.sh). This workflow then skips that
# version.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package versions
        # Guard against the silent-skip footgun: pnpm -r publish skips any
        # version the registry already has, so an un-bumped manifest turns a
        # release into a green no-op. Fail loudly instead.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FAIL=0
          for f in packages/*/package.json; do
            PKG_NAME=$(node -p "require('./$f').name")
            PKG_VERSION=$(node -p "require('./$f').version")
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::$PKG_NAME is $PKG_VERSION but the tag says $TAG_VERSION (lockstep bump missing)"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Check package tarballs
        run: ./scripts/check-package-tarballs.sh

      - name: Publish
        run: pnpm -r publish --no-git-checks
